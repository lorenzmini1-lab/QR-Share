<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de QR Code Universel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        input[type="file"] { display: none; }
        .file-upload-btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-block;
            font-weight: bold;
        }
        .file-upload-btn:hover { background-color: #0056b3; }
        #preview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 15px;
            border-radius: 6px;
            display: none;
        }
        .qr-container { margin-top: 20px; display: none; }
        #qrcode { margin-top: 15px; }
        #loading { display: none; margin-top: 15px; color: #007bff; font-weight: bold; }
        .warning { font-size: 12px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Partager une photo par QR Code</h2>
        
        <label for="photoInput" class="file-upload-btn">Choisir une photo</label>
        <input type="file" id="photoInput" accept="image/*">
        
        <div id="loading">Envoi de la photo en cours...</div>
        <div>
            <img id="preview" alt="Aperçu de la photo">
        </div>

        <div class="qr-container" id="qrSection">
            <h3>Ton QR Code universel :</h3>
            <canvas id="qrcode"></canvas>
            <p class="warning">Scanne ce code depuis n'importe quel Android ou iPhone pour voir la photo.</p>
        </div>
    </div>

    <script>
        const photoInput = document.getElementById('photoInput');
        const preview = document.getElementById('preview');
        const qrSection = document.getElementById('qrSection');
        const loading = document.getElementById('loading');
        
        const qr = new QRious({
            element: document.getElementById('qrcode'),
            size: 250,
            level: 'M'
        });

        photoInput.addEventListener('change', async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Afficher l'aperçu local
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
            qrSection.style.display = 'none';
            loading.style.display = 'block';

            // Préparer l'envoi vers un hébergeur gratuit (ImgBB API publique)
            const formData = new FormData();
            formData.append('image', file);

            try {
                // Clé API publique de démonstration ImgBB
                const response = await fetch('https://api.imgbb.com/1/upload?key=6d207e02194a847a9aa61a0a7313f848', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const imageUrl = data.data.url;
                    
                    // Générer le QR code avec le lien web léger
                    qr.value = imageUrl;
                    loading.style.display = 'none';
                    qrSection.style.display = 'block';
                } else {
                    alert("Erreur lors de l'envoi de l'image.");
                    loading.style.display = 'none';
                }
            } catch (error) {
                alert("Erreur réseau. Vérifie ta connexion internet.");
                loading.style.display = 'none';
            }
        });
    </script>

</body>
</html>
