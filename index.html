<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partage Photo QR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; text-decoration: none; display: inline-block; }
        .btn-success { background: #28a745; }
        #status { font-weight: bold; margin: 15px 0; color: #555; }
        img { max-width: 100%; border-radius: 8px; margin-top: 15px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Partage Photo QR</h2>
    <div id="status">Chargement...</div>

    <!-- Section Émetteur -->
    <div id="senderSection" style="display:none;">
        <label for="photoInput" class="btn">Sélectionner une photo</label>
        <input type="file" id="photoInput" accept="image/*">
        <br>
        <canvas id="qrcode" style="display:none; margin-top:15px;"></canvas>
        <p id="qrHelp" style="display:none; font-size:12px; color:#666;">Scanne ce QR code léger avec l'autre téléphone.</p>
    </div>

    <!-- Section Récepteur -->
    <div id="receiverSection" style="display:none;">
        <p>Récupération de la photo...</p>
        <img id="receivedImage" alt="" style="display:none;">
        <br>
        <a id="downloadBtn" class="btn btn-success" style="display:none;" download="photo_recue.jpg">Télécharger la photo</a>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const imgId = urlParams.get('id');

    const statusDiv = document.getElementById('status');
    const senderSection = document.getElementById('senderSection');
    const receiverSection = document.getElementById('receiverSection');
    const photoInput = document.getElementById('photoInput');
    const qrcodeCanvas = document.getElementById('qrcode');
    const qrHelp = document.getElementById('qrHelp');
    const receivedImage = document.getElementById('receivedImage');
    const downloadBtn = document.getElementById('downloadBtn');

    const qr = new QRious({ element: qrcodeCanvas, size: 250, level: 'M' });

    if (imgId) {
        // MODE RÉCEPTEUR : Récupère l'image depuis le relais ntfy.sh
        senderSection.style.display = 'none';
        receiverSection.style.display = 'block';
        statusDiv.innerText = "Téléchargement de l'image en cours...";

        fetch(`https://ntfy.sh/${imgId}/raw`)
            .then(res => res.blob())
            .then(blob => {
                const imgUrl = URL.createObjectURL(blob);
                receivedImage.src = imgUrl;
                receivedImage.style.display = 'inline-block';
                downloadBtn.href = imgUrl;
                downloadBtn.style.display = 'inline-block';
                statusDiv.innerText = "Photo reçue avec succès !";
            })
            .catch(() => {
                statusDiv.innerText = "Erreur lors du téléchargement de la photo.";
            });

    } else {
        // MODE ÉMETTEUR
        statusDiv.innerText = "Sélectionne une photo à partager.";
        senderSection.style.display = 'block';

        photoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                statusDiv.innerText = "Préparation de l'envoi...";
                
                // Générer un ID unique de canal
                const channelId = 'photo_' + Math.random().toString(36).substring(2, 11);

                fetch(`https://ntfy.sh/${channelId}`, {
                    method: 'PUT',
                    body: file
                })
                .then(res => {
                    if (res.ok) {
                        const shareableUrl = `${window.location.origin}${window.location.pathname}?id=${channelId}`;
                        qr.value = shareableUrl;
                        qrcodeCanvas.style.display = 'inline-block';
                        qrHelp.style.display = 'block';
                        statusDiv.innerText = "QR Code prêt ! Scanne-le maintenant.";
                    } else {
                        statusDiv.innerText = "Erreur d'envoi du fichier.";
                    }
                })
                .catch(() => {
                    statusDiv.innerText = "Erreur de réseau.";
                });
            }
        });
    }
</script>

</body>
</html>
