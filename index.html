<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partage Photo Universal 1.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; text-decoration: none; display: inline-block; }
        .btn-success { background: #28a745; }
        #status { font-weight: bold; margin: 15px 0; color: #555; }
        img { max-width: 100%; border-radius: 8px; margin-top: 15px; display: block; margin-left: auto; margin-right: auto; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Partage Photo Universal</h2>
    <div id="status">Chargement...</div>

    <!-- Section Émetteur -->
    <div id="senderSection" style="display:none;">
        <label for="photoInput" class="btn">Sélectionner une photo</label>
        <input type="file" id="photoInput" accept="image/*">
        <br>
        <canvas id="qrcode" style="display:none; margin-top:15px;"></canvas>
        <p id="qrHelp" style="display:none; font-size:12px; color:#666;">Scanne ce QR code avec l'autre téléphone.</p>
    </div>

    <!-- Section Récepteur -->
    <div id="receiverSection" style="display:none;">
        <img id="receivedImage" alt="Photo transmise" style="display:none;">
        <br>
        <a id="downloadBtn" class="btn btn-success" style="display:none;" download="photo_recue.jpg">Télécharger la photo</a>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const imgUrlParam = urlParams.get('img');

    const statusDiv = document.getElementById('status');
    const senderSection = document.getElementById('senderSection');
    const receiverSection = document.getElementById('receiverSection');
    const photoInput = document.getElementById('photoInput');
    const qrcodeCanvas = document.getElementById('qrcode');
    const qrHelp = document.getElementById('qrHelp');
    const receivedImage = document.getElementById('receivedImage');
    const downloadBtn = document.getElementById('downloadBtn');

    const qr = new QRious({ element: qrcodeCanvas, size: 250, level: 'M' });

    function compressAndConvert(file, callback) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let max = 1000;
                let w = img.width, h = img.height;
                if (w > h) { if (w > max) { h *= max / w; w = max; } }
                else { if (h > max) { w *= max / h; h = max; } }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                // On extrait en base64 pur sans le préfixe data:image/jpeg;base64,
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                const base64Data = dataUrl.split(',')[1];
                callback(base64Data);
            };
        };
    }

    if (imgUrlParam) {
        // MODE RÉCEPTEUR
        senderSection.style.display = 'none';
        receiverSection.style.display = 'block';
        statusDiv.innerText = "Chargement de la photo...";

        const finalUrl = decodeURIComponent(imgUrlParam);

        receivedImage.onload = () => {
            statusDiv.innerText = "Photo reçue avec succès !";
            downloadBtn.style.display = 'inline-block';
        };

        receivedImage.onerror = () => {
            statusDiv.innerText = "Erreur de chargement de l'image.";
        };

        receivedImage.src = finalUrl;
        receivedImage.style.display = 'block';
        downloadBtn.href = finalUrl;
        downloadBtn.setAttribute('target', '_blank');

    } else {
        // MODE ÉMETTEUR
        statusDiv.innerText = "Sélectionne une photo à partager.";
        senderSection.style.display = 'block';

        photoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                statusDiv.innerText = "Compression de la photo...";

                compressAndConvert(file, (base64Data) => {
                    statusDiv.innerText = "Envoi de la photo (5G/Wi-Fi)...";

                    const formData = new FormData();
                    formData.append('key', '6d207e02198a847aa98d0a2a901485a5'); // Clé publique gratuite ImgBB intégrée
                    formData.append('image', base64Data);

                    fetch('https://api.imgbb.com/1/upload', {
                        method: 'POST',
                        body: formData
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.success) {
                            const imageUrl = data.data.url;
                            const shareableUrl = `${window.location.origin}${window.location.pathname}?img=${encodeURIComponent(imageUrl)}`;
                            
                            qr.value = shareableUrl;
                            qrcodeCanvas.style.display = 'inline-block';
                            qrHelp.style.display = 'block';
                            statusDiv.innerText = "QR Code prêt ! Scanne-le maintenant.";
                        } else {
                            statusDiv.innerText = "Erreur lors de l'envoi de l'image.";
                        }
                    })
                    .catch(() => {
                        statusDiv.innerText = "Erreur de connexion réseau.";
                    });
                });
            }
        });
    }
</script>

</body>
</html>
