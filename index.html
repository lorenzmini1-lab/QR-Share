<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partage Photo Universal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; text-decoration: none; display: inline-block; }
        .btn-success { background: #28a745; }
        #status { font-weight: bold; margin: 15px 0; color: #555; }
        img { max-width: 100%; border-radius: 8px; margin-top: 15px; display: block; margin-left: auto; margin-right: auto; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Partage Photo Universal</h2>
    <div id="status">Chargement...</div>

    <!-- Section Émetteur -->
    <div id="senderSection" style="display:none;">
        <label for="photoInput" class="btn">Sélectionner une photo</label>
        <input type="file" id="photoInput" accept="image/*">
        <br>
        <canvas id="qrcode" style="display:none; margin-top:15px;"></canvas>
        <p id="qrHelp" style="display:none; font-size:12px; color:#666;">Scanne ce QR code avec l'autre téléphone.</p>
    </div>

    <!-- Section Récepteur -->
    <div id="receiverSection" style="display:none;">
        <img id="receivedImage" alt="Photo transmise" style="display:none;">
        <br>
        <button id="downloadBtn" class="btn btn-success" style="display:none;">Télécharger la photo</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const imgUrlParam = urlParams.get('url');

    const statusDiv = document.getElementById('status');
    const senderSection = document.getElementById('senderSection');
    const receiverSection = document.getElementById('receiverSection');
    const photoInput = document.getElementById('photoInput');
    const qrcodeCanvas = document.getElementById('qrcode');
    const qrHelp = document.getElementById('qrHelp');
    const receivedImage = document.getElementById('receivedImage');
    const downloadBtn = document.getElementById('downloadBtn');

    const qr = new QRious({ element: qrcodeCanvas, size: 250, level: 'M' });

    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let max = 800;
                let w = img.width, h = img.height;
                if (w > h) { if (w > max) { h *= max / w; w = max; } }
                else { if (h > max) { w *= max / h; h = max; } }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                canvas.toBlob((blob) => {
                    callback(blob);
                }, 'image/jpeg', 0.7);
            };
        };
    }

    if (imgUrlParam) {
        // MODE RÉCEPTEUR
        senderSection.style.display = 'none';
        receiverSection.style.display = 'block';
        statusDiv.innerText = "Récupération de la photo...";

        const rawUrl = decodeURIComponent(imgUrlParam);

        receivedImage.onload = () => {
            statusDiv.innerText = "Photo reçue avec succès !";
            downloadBtn.style.display = 'inline-block';
        };

        receivedImage.onerror = () => {
            statusDiv.innerText = "Erreur de chargement de l'image.";
        };

        receivedImage.src = rawUrl;
        receivedImage.style.display = 'block';

        // Gestion forcée du téléchargement pour mobile
        downloadBtn.addEventListener('click', () => {
            statusDiv.innerText = "Téléchargement en cours...";
            fetch(rawUrl)
                .then(response => response.blob())
                .then(blob => {
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = "photo_recue.jpg";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                    statusDiv.innerText = "Téléchargement terminé !";
                })
                .catch(() => {
                    // Repli si le téléchargement automatique est bloqué : ouverture dans un nouvel onglet
                    window.open(rawUrl, '_blank');
                    statusDiv.innerText = "Appuie longuement sur l'image pour la sauvegarder.";
                });
        });

    } else {
        // MODE ÉMETTEUR
        statusDiv.innerText = "Sélectionne une photo à partager.";
        senderSection.style.display = 'block';

        photoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                statusDiv.innerText = "Optimisation de la photo...";

                compressImage(file, (compressedBlob) => {
                    statusDiv.innerText = "Envoi de la photo (5G/Wi-Fi)...";

                    const formData = new FormData();
                    formData.append('reqtype', 'fileupload');
                    formData.append('time', '1h');
                    formData.append('fileToUpload', compressedBlob, 'photo.jpg');

                    fetch('https://corsproxy.io/?' + encodeURIComponent('https://litterbox.catbox.moe/resources/internals/api.php'), {
                        method: 'POST',
                        body: formData
                    })
                    .then(res => res.text())
                    .then(fileUrl => {
                        if (fileUrl && fileUrl.startsWith('http')) {
                            const shareableUrl = `${window.location.origin}${window.location.pathname}?url=${encodeURIComponent(fileUrl.trim())}`;
                            
                            qr.value = shareableUrl;
                            qrcodeCanvas.style.display = 'inline-block';
                            qrHelp.style.display = 'block';
                            statusDiv.innerText = "QR Code prêt ! Scanne-le maintenant.";
                        } else {
                            statusDiv.innerText = "Erreur lors de l'envoi de la photo.";
                        }
                    })
                    .catch(() => {
                        statusDiv.innerText = "Erreur de connexion.";
                    });
                });
            }
        });
    }
</script>

</body>
</html>
