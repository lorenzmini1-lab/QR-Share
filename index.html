<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partage Photo Instantané</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; text-decoration: none; display: inline-block; }
        .btn-success { background: #28a745; }
        #status { font-weight: bold; margin: 15px 0; color: #555; }
        img { max-width: 100%; border-radius: 8px; margin-top: 15px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Partage Photo Instantané</h2>
    <div id="status">Initialisation du réseau...</div>

    <!-- Section Émetteur -->
    <div id="senderSection" style="display:none;">
        <label for="photoInput" class="btn">Sélectionner une photo</label>
        <input type="file" id="photoInput" accept="image/*">
        <br>
        <button id="sendBtn" class="btn btn-success" style="display:none;">Forcer l'envoi</button>
        <br>
        <canvas id="qrcode" style="display:none; margin-top:15px;"></canvas>
        <p id="qrHelp" style="display:none; font-size:12px; color:#666;">Scanne ce QR code avec l'autre téléphone.</p>
    </div>

    <!-- Section Récepteur -->
    <div id="receiverSection" style="display:none;">
        <p id="recvHelp">Connexion à l'émetteur...</p>
        <img id="receivedImage" alt="" style="display:none;">
        <br>
        <a id="downloadBtn" class="btn btn-success" style="display:none;" download="photo_recue.jpg">Télécharger la photo</a>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetPeerId = urlParams.get('peer');

    const statusDiv = document.getElementById('status');
    const senderSection = document.getElementById('senderSection');
    const receiverSection = document.getElementById('receiverSection');
    const photoInput = document.getElementById('photoInput');
    const sendBtn = document.getElementById('sendBtn');
    const qrcodeCanvas = document.getElementById('qrcode');
    const qrHelp = document.getElementById('qrHelp');
    const receivedImage = document.getElementById('receivedImage');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentConn = null;
    let selectedImageData = null;

    const qr = new QRious({ element: qrcodeCanvas, size: 250 });

    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let max = 500;
                let w = img.width, h = img.height;
                if (w > h) { if (w > max) { h *= max / w; w = max; } }
                else { if (h > max) { w *= max / h; h = max; } }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                callback(canvas.toDataURL('image/jpeg', 0.4));
            };
        };
    }

    // Identifiant unique de connexion
    const peer = new Peer();

    function sendData() {
        if (currentConn && selectedImageData) {
            statusDiv.innerText = "Transmission de l'image...";
            currentConn.send(selectedImageData);
            statusDiv.innerText = "Photo envoyée !";
        }
    }

    peer.on('open', (id) => {
        if (targetPeerId) {
            // MODE RÉCEPTEUR
            senderSection.style.display = 'none';
            receiverSection.style.display = 'block';
            statusDiv.innerText = "Connexion à l'émetteur...";

            const conn = peer.connect(targetPeerId);

            conn.on('open', () => {
                statusDiv.innerText = "Connecté ! En attente de l'image...";
            });

            conn.on('data', (data) => {
                receivedImage.src = data;
                receivedImage.style.display = 'inline-block';
                downloadBtn.href = data;
                downloadBtn.style.display = 'inline-block';
                statusDiv.innerText = "Photo reçue avec succès !";
            });

        } else {
            // MODE ÉMETTEUR
            statusDiv.innerText = "Sélectionne une photo à partager.";
            senderSection.style.display = 'block';

            const receiverUrl = `${window.location.origin}${window.location.pathname}?peer=${id}`;
            qr.value = receiverUrl;

            peer.on('connection', (conn) => {
                currentConn = conn;
                statusDiv.innerText = "Récepteur connecté !";
                sendBtn.style.display = 'inline-block';
                
                conn.on('open', () => {
                    sendData();
                });
            });
        }
    });

    photoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            statusDiv.innerText = "Traitement de l'image...";
            compressImage(file, (base64) => {
                selectedImageData = base64;
                qrcodeCanvas.style.display = 'inline-block';
                qrHelp.style.display = 'block';
                statusDiv.innerText = "QR Code prêt. Scanne-le maintenant.";
                sendData();
            });
        }
    });

    sendBtn.addEventListener('click', sendData);
</script>

</body>
</html>
