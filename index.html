<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partage Photo Sécurisé</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; text-decoration: none; display: inline-block; }
        .btn-success { background: #28a745; }
        #status { font-weight: bold; margin: 15px 0; color: #555; }
        img { max-width: 100%; border-radius: 8px; margin-top: 15px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Partage Instantané</h2>
    <div id="status">Sélectionne une photo à partager.</div>

    <!-- Section Émetteur -->
    <div id="senderSection">
        <label for="photoInput" class="btn">Sélectionner une photo</label>
        <input type="file" id="photoInput" accept="image/*">
        <br>
        <canvas id="qrcode" style="display:none; margin-top:15px;"></canvas>
        <p id="qrHelp" style="display:none; font-size:12px; color:#666;">Scanne ce QR code avec n'importe quel téléphone pour télécharger la photo.</p>
    </div>

    <!-- Section Récepteur -->
    <div id="receiverSection" style="display:none;">
        <p>Téléchargement de l'image...</p>
        <a id="downloadBtn" class="btn btn-success" download="photo.jpg">Télécharger la photo</a>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const downloadUrl = urlParams.get('download');

    const statusDiv = document.getElementById('status');
    const senderSection = document.getElementById('senderSection');
    const receiverSection = document.getElementById('receiverSection');
    const photoInput = document.getElementById('photoInput');
    const qrcodeCanvas = document.getElementById('qrcode');
    const qrHelp = document.getElementById('qrHelp');
    const downloadBtn = document.getElementById('downloadBtn');

    const qr = new QRious({ element: qrcodeCanvas, size: 250 });

    // Si on ouvre la page via le QR code scanned
    if (downloadUrl) {
        senderSection.style.display = 'none';
        receiverSection.style.display = 'block';
        statusDiv.innerText = "Photo prête à être téléchargée !";
        downloadBtn.href = decodeURIComponent(downloadUrl);
    }

    photoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            statusDiv.innerText = "Création du lien temporaire...";
            
            const formData = new FormData();
            formData.append('file', file);

            // Envoi vers l'API de transfert temporaire gratuit (file.io)
            fetch('https://file.io', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const shareableUrl = `${window.location.origin}${window.location.pathname}?download=${encodeURIComponent(data.link)}`;
                    qr.value = shareableUrl;
                    qrcodeCanvas.style.display = 'inline-block';
                    qrHelp.style.display = 'block';
                    statusDiv.innerText = "QR Code prêt ! Scanne-le avec l'autre téléphone.";
                } else {
                    statusDiv.innerText = "Erreur lors de la création du lien.";
                }
            })
            .catch(() => {
                statusDiv.innerText = "Erreur de connexion au service d'envoi.";
            });
        }
    });
</script>

</body>
</html>
