<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de QR Code pour Photo</title>
    <!-- Inclusion de la bibliothèque qrious pour générer le QR code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        input[type="file"] {
            display: none;
        }
        .file-upload-btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-block;
            font-weight: bold;
            transition: background 0.3s;
        }
        .file-upload-btn:hover {
            background-color: #0056b3;
        }
        #preview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 15px;
            border-radius: 6px;
            display: none;
        }
        .qr-container {
            margin-top: 20px;
        }
        #qrcode {
            margin-top: 15px;
        }
        .warning {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Partager une photo par QR Code</h2>
        
        <label for="photoInput" class="file-upload-btn">Choisir une photo</label>
        <input type="file" id="photoInput" accept="image/*">
        
        <div>
            <img id="preview" alt="Aperçu de la photo">
        </div>

        <div class="qr-container" id="qrSection" style="display: none;">
            <h3>Ton QR Code :</h3>
            <canvas id="qrcode"></canvas>
            <p class="warning">Scanne ce code pour ouvrir la photo.</p>
        </div>
    </div>

    <script>
        const photoInput = document.getElementById('photoInput');
        const preview = document.getElementById('preview');
        const qrSection = document.getElementById('qrSection');
        
        // Initialisation de l'objet QRious
        const qr = new QRious({
            element: document.getElementById('qrcode'),
            size: 250,
            level: 'H'
        });

        photoInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const base64Image = e.target.result;
                    
                    // Afficher l'aperçu de l'image
                    preview.src = base64Image;
                    preview.style.display = 'block';
                    
                    // Générer le QR code contenant l'image encodée
                    qr.value = base64Image;
                    
                    // Afficher la section du QR code
                    qrSection.style.display = 'block';
                };
                
                reader.readAsDataURL(file);
            }
        });
    </script>

</body>
</html>
