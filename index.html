<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de QR Code pour Lien Photo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover { background-color: #0056b3; }
        .qr-container { margin-top: 20px; display: none; }
        #qrcode { margin-top: 15px; }
        .warning { font-size: 12px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Générer un QR Code de Photo</h2>
        <p style="font-size: 14px; color: #555;">Colle le lien web de ta photo (Google Drive, OneDrive, etc.) :</p>
        
        <input type="text" id="urlInput" placeholder="https://exemples.com/ma-photo.jpg">
        <br>
        <button class="btn" onclick="generateQR()">Générer le QR Code</button>

        <div class="qr-container" id="qrSection">
            <h3>Ton QR Code :</h3>
            <canvas id="qrcode"></canvas>
            <p class="warning">Scanne ce code pour ouvrir la photo.</p>
        </div>
    </div>

    <script>
        const qr = new QRious({
            element: document.getElementById('qrcode'),
            size: 250,
            level: 'M'
        });

        function generateQR() {
            const url = document.getElementById('urlInput').value.trim();
            if (url) {
                qr.value = url;
                document.getElementById('qrSection').style.display = 'block';
            } else {
                alert("Veuillez entrer un lien valide.");
            }
        }
    </script>

</body>
</html>
