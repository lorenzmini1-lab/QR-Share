<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partage Photo P2P (WebRTC)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; text-decoration: none; display: inline-block; }
        .btn-success { background: #28a745; }
        #status { font-weight: bold; margin: 15px 0; color: #555; }
        img { max-width: 100%; border-radius: 8px; margin-top: 15px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Partage P2P (Émetteur / Récepteur)</h2>
    <div id="status">Connexion au réseau P2P...</div>

    <!-- Section Émetteur -->
    <div id="senderSection" style="display:none;">
        <label for="photoInput" class="btn">Sélectionner une photo</label>
        <input type="file" id="photoInput" accept="image/*">
        <br>
        <canvas id="qrcode" style="display:none; margin-top:15px;"></canvas>
        <p id="qrHelp" style="display:none; font-size:12px; color:#666;">Scanne ce QR code avec l'autre téléphone.</p>
    </div>

    <!-- Section Récepteur -->
    <div id="receiverSection" style="display:none;">
        <p id="recvHelp">En attente de la réception...</p>
        <img id="receivedImage" alt="Photo reçue">
        <br>
        <a id="downloadBtn" class="btn btn-success" style="display:none;" download="photo_recue.jpg">Télécharger la photo</a>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetPeerId = urlParams.get('peer');

    const statusDiv = document.getElementById('status');
    const senderSection = document.getElementById('senderSection');
    const receiverSection = document.getElementById('receiverSection');
    const photoInput = document.getElementById('photoInput');
    const qrcodeCanvas = document.getElementById('qrcode');
    const qrHelp = document.getElementById('qrHelp');
    const receivedImage = document.getElementById('receivedImage');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentConnection = null;
    let selectedImageData = null;

    const qr = new QRious({ element: qrcodeCanvas, size: 250 });
    const peer = new Peer();

    // Redimensionner la photo
    function compressImage(file, maxWidth, maxHeight, quality, callback) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                } else {
                    if (height > maxHeight) {
                        width = Math.round((width * maxHeight) / height);
                        height = maxHeight;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d'); // Correction ici (2d à la place de canvas)
                ctx.drawImage(img, 0, 0, width, height);
                callback(canvas.toDataURL('image/jpeg', quality));
            };
        };
    }

    peer.on('open', (id) => {
        if (targetPeerId) {
            // MODE RÉCEPTEUR
            statusDiv.innerText = "Mode Récepteur : Connexion en cours...";
            receiverSection.style.display = 'block';

            const conn = peer.connect(targetPeerId, { reliable: true });
            
            conn.on('open', () => {
                statusDiv.innerText = "Connecté ! Transfert de la photo...";
            });

            conn.on('data', (data) => {
                receivedImage.src = data;
                downloadBtn.href = data;
                downloadBtn.style.display = 'inline-block';
                statusDiv.innerText = "Photo reçue avec succès !";
            });

            conn.on('error', () => {
                statusDiv.innerText = "Erreur de connexion.";
            });

        } else {
            // MODE ÉMETTEUR
            statusDiv.innerText = "Mode Émetteur prêt. Choisis une photo.";
            senderSection.style.display = 'block';

            const receiverUrl = `${window.location.origin}${window.location.pathname}?peer=${id}`;
            qr.value = receiverUrl;

            peer.on('connection', (conn) => {
                currentConnection = conn;
                statusDiv.innerText = "Appareil récepteur connecté !";

                conn.on('open', () => {
                    if (selectedImageData) {
                        statusDiv.innerText = "Envoi de la photo en cours...";
                        conn.send(selectedImageData);
                        statusDiv.innerText = "Photo envoyée !";
                    }
                });
            });
        }
    });

    photoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            statusDiv.innerText = "Optimisation de l'image...";
            
            compressImage(file, 1000, 1000, 0.6, (base64Img) => {
                selectedImageData = base64Img;
                qrcodeCanvas.style.display = 'inline-block';
                qrHelp.style.display = 'block';

                if (currentConnection && currentConnection.open) {
                    statusDiv.innerText = "Envoi de la photo...";
                    currentConnection.send(selectedImageData);
                    statusDiv.innerText = "Photo envoyée !";
                } else {
                    statusDiv.innerText = "Scanne le QR code pour envoyer la photo.";
                }
            });
        }
    });
</script>

</body>
</html>
