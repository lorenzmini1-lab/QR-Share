<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partage Fichier Universal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; text-decoration: none; display: inline-block; }
        .btn-success { background: #28a745; }
        #status { font-weight: bold; margin: 15px 0; color: #555; }
        img { max-width: 100%; border-radius: 8px; margin-top: 15px; display: block; margin-left: auto; margin-right: auto; }
        #fileInfo { margin-top: 15px; font-weight: bold; color: #333; word-break: break-all; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Partage Fichier Universal</h2>
    <div id="status">Chargement...</div>

    <!-- Section Émetteur -->
    <div id="senderSection" style="display:none;">
        <label for="fileInput" class="btn">Sélectionner un fichier</label>
        <input type="file" id="fileInput">
        <br>
        <canvas id="qrcode" style="display:none; margin-top:15px;"></canvas>
        <p id="qrHelp" style="display:none; font-size:12px; color:#666;">Scanne ce QR code avec l'autre téléphone.</p>
    </div>

    <!-- Section Récepteur -->
    <div id="receiverSection" style="display:none;">
        <div id="fileInfo"></div>
        <img id="previewImage" alt="Aperçu" style="display:none;">
        <br>
        <button id="downloadBtn" class="btn btn-success" style="display:none;">Télécharger le fichier</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const fileUrlParam = urlParams.get('url');
    const fileNameParam = urlParams.get('name') || "fichier_recu";

    const statusDiv = document.getElementById('status');
    const senderSection = document.getElementById('senderSection');
    const receiverSection = document.getElementById('receiverSection');
    const fileInput = document.getElementById('fileInput');
    const qrcodeCanvas = document.getElementById('qrcode');
    const qrHelp = document.getElementById('qrHelp');
    const previewImage = document.getElementById('previewImage');
    const downloadBtn = document.getElementById('downloadBtn');
    const fileInfo = document.getElementById('fileInfo');

    const qr = new QRious({ element: qrcodeCanvas, size: 250, level: 'M' });

    function processFile(file, callback) {
        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let max = 800;
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > max) { h *= max / w; w = max; } }
                    else { if (h > max) { w *= max / h; h = max; } }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    canvas.toBlob((blob) => {
                        callback(blob, file.name);
                    }, 'image/jpeg', 0.7);
                };
            };
        } else {
            callback(file, file.name);
        }
    }

    if (fileUrlParam) {
        // MODE RÉCEPTEUR
        senderSection.style.display = 'none';
        receiverSection.style.display = 'block';
        statusDiv.innerText = "Fichier prêt au téléchargement.";
        fileInfo.innerText = "Fichier : " + fileNameParam;

        const rawUrl = decodeURIComponent(fileUrlParam);

        // Si c'est une image, on affiche un aperçu
        if (fileNameParam.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
            previewImage.src = rawUrl;
            previewImage.style.display = 'block';
        }

        downloadBtn.style.display = 'inline-block';

        downloadBtn.addEventListener('click', () => {
            statusDiv.innerText = "Téléchargement en cours...";
            fetch(rawUrl)
                .then(response => response.blob())
                .then(blob => {
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = fileNameParam;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                    statusDiv.innerText = "Téléchargement terminé !";
                })
                .catch(() => {
                    window.open(rawUrl, '_blank');
                    statusDiv.innerText = "Erreur de téléchargement direct. Ouverture dans un nouvel onglet...";
                });
        });

    } else {
        // MODE ÉMETTEUR
        statusDiv.innerText = "Sélectionne un fichier à partager.";
        senderSection.style.display = 'block';

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                statusDiv.innerText = "Préparation du fichier...";

                processFile(file, (processedBlob, fileName) => {
                    statusDiv.innerText = "Envoi du fichier...";

                    const formData = new FormData();
                    formData.append('reqtype', 'fileupload');
                    formData.append('time', '1h');
                    formData.append('fileToUpload', processedBlob, fileName);

                    fetch('https://corsproxy.io/?' + encodeURIComponent('https://litterbox.catbox.moe/resources/internals/api.php'), {
                        method: 'POST',
                        body: formData
                    })
                    .then(res => res.text())
                    .then(fileUrl => {
                        if (fileUrl && fileUrl.startsWith('http')) {
                            const shareableUrl = `${window.location.origin}${window.location.pathname}?url=${encodeURIComponent(fileUrl.trim())}&name=${encodeURIComponent(fileName)}`;
                            
                            qr.value = shareableUrl;
                            qrcodeCanvas.style.display = 'inline-block';
                            qrHelp.style.display = 'block';
                            statusDiv.innerText = "QR Code prêt ! Scanne-le maintenant.";
                        } else {
                            statusDiv.innerText = "Erreur lors de l'envoi du fichier.";
                        }
                    })
                    .catch(() => {
                        statusDiv.innerText = "Erreur de connexion.";
                    });
                });
            }
        });
    }
</script>

</body>
</html>
