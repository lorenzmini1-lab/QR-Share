<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partage Fichier</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <!-- Convertisseur HEIC vers JPEG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; text-decoration: none; display: inline-block; }
        .btn-success { background: #28a745; }
        .btn-secondary { background: #6c757d; }
        #status { font-weight: bold; margin: 15px 0; color: #555; }
        img { max-width: 100%; border-radius: 8px; margin-top: 15px; display: block; margin-left: auto; margin-right: auto; }
        #fileInfo { margin-top: 15px; font-weight: bold; color: #333; word-break: break-all; }
        input[type="file"] { display: none; }
        
        .progress-container { width: 100%; background-color: #e0e0e0; border-radius: 8px; overflow: hidden; margin: 15px 0; display: none; }
        .progress-bar { width: 0%; height: 20px; background-color: #28a745; transition: width 0.2s ease; }
        #progressText { font-size: 13px; font-weight: bold; color: #333; margin-top: 5px; display: none; }

        .qr-actions { margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Partage Fichier</h2>
    <div id="status">Chargement...</div>

    <!-- Barre de progression -->
    <div id="progressContainer" class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
    </div>
    <div id="progressText">0%</div>

    <!-- Section Émetteur -->
    <div id="senderSection" style="display:none;">
        <label for="fileInput" class="btn">Sélectionne un fichier</label>
        <input type="file" id="fileInput">
        <br>
        <canvas id="qrcode" style="display:none; margin-top:15px;"></canvas>
        <p id="qrHelp" style="display:none; font-size:12px; color:#666;">Scanne ce QR code.</p>
        
        <!-- Actions pour le QR Code -->
        <div id="qrActions" class="qr-actions">
            <button id="shareLinkBtn" class="btn">Partager le lien</button>
            <button id="downloadQrBtn" class="btn btn-secondary">Télécharger le QR Code</button>
        </div>
    </div>

    <!-- Section Récepteur -->
    <div id="receiverSection" style="display:none;">
        <div id="fileInfo"></div>
        <img id="previewImage" alt="Aperçu" style="display:none;">
        <br>
        <button id="downloadBtn" class="btn btn-success" style="display:none;">Télécharger le fichier</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const fileUrlParam = urlParams.get('url');
    const fileNameParam = urlParams.get('name') || "fichier_recu";

    const statusDiv = document.getElementById('status');
    const senderSection = document.getElementById('senderSection');
    const receiverSection = document.getElementById('receiverSection');
    const fileInput = document.getElementById('fileInput');
    const qrcodeCanvas = document.getElementById('qrcode');
    const qrHelp = document.getElementById('qrHelp');
    const previewImage = document.getElementById('previewImage');
    const downloadBtn = document.getElementById('downloadBtn');
    const fileInfo = document.getElementById('fileInfo');

    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    const qrActions = document.getElementById('qrActions');
    const shareLinkBtn = document.getElementById('shareLinkBtn');
    const downloadQrBtn = document.getElementById('downloadQrBtn');

    const qr = new QRious({ element: qrcodeCanvas, size: 250, level: 'M' });
    let currentShareableUrl = "";

    function showProgress(percent) {
        progressContainer.style.display = 'block';
        progressText.style.display = 'block';
        progressBar.style.width = percent + '%';
        progressText.innerText = Math.round(percent) + '%';
    }

    function hideProgress() {
        progressContainer.style.display = 'none';
        progressText.style.display = 'none';
        progressBar.style.width = '0%';
    }

    function compressCanvasImage(img, fileName, callback) {
        const canvas = document.createElement('canvas');
        let max = 800;
        let w = img.width, h = img.height;
        if (w > h) { if (w > max) { h *= max / w; w = max; } }
        else { if (h > max) { w *= max / h; h = max; } }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob((blob) => {
            const newName = fileName.replace(/\.(heic|heif)$/i, '.jpg');
            callback(blob, newName);
        }, 'image/jpeg', 0.7);
    }

    async function processFile(file, callback) {
        const isHeic = file.name.match(/\.(heic|heif)$/i);
        const isStandardImage = file.type.startsWith('image/') || isHeic;

        if (isStandardImage) {
            statusDiv.innerText = isHeic ? "Conversion du format HEIC..." : "Optimisation de l'image...";
            
            let blobToProcess = file;

            if (isHeic) {
                try {
                    const convertedBlob = await heic2any({
                        blob: file,
                        toType: "image/jpeg",
                        quality: 0.8
                    });
                    blobToProcess = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
                } catch (err) {
                    console.error("Erreur conversion HEIC:", err);
                    callback(file, file.name);
                    return;
                }
            }

            const reader = new FileReader();
            reader.readAsDataURL(blobToProcess);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    compressCanvasImage(img, file.name, callback);
                };
            };
        } else {
            callback(file, file.name);
        }
    }

    if (fileUrlParam) {
        // MODE RÉCEPTEUR
        senderSection.style.display = 'none';
        receiverSection.style.display = 'block';
        statusDiv.innerText = "Fichier prêt au téléchargement.";
        fileInfo.innerText = "Fichier : " + fileNameParam;

        const rawUrl = decodeURIComponent(fileUrlParam);

        if (fileNameParam.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
            previewImage.src = rawUrl;
            previewImage.style.display = 'block';
        }

        downloadBtn.style.display = 'inline-block';

        downloadBtn.addEventListener('click', () => {
            statusDiv.innerText = "Téléchargement en cours...";
            downloadBtn.style.display = 'none';
            showProgress(0);

            const xhr = new XMLHttpRequest();
            xhr.open('GET', rawUrl, true);
            xhr.responseType = 'blob';

            xhr.onprogress = (event) => {
                if (event.lengthComputable) {
                    const percentComplete = (event.loaded / event.total) * 100;
                    showProgress(percentComplete);
                }
            };

            xhr.onload = () => {
                if (xhr.status === 200) {
                    const blob = xhr.response;
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = fileNameParam;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);

                    hideProgress();
                    statusDiv.innerText = "Téléchargement terminé !";
                    downloadBtn.style.display = 'inline-block';
                } else {
                    hideProgress();
                    window.open(rawUrl, '_blank');
                    statusDiv.innerText = "Erreur. Ouverture dans un nouvel onglet...";
                    downloadBtn.style.display = 'inline-block';
                }
            };

            xhr.onerror = () => {
                hideProgress();
                window.open(rawUrl, '_blank');
                statusDiv.innerText = "Erreur réseau. Ouverture directe...";
                downloadBtn.style.display = 'inline-block';
            };

            xhr.send();
        });

    } else {
        // MODE ÉMETTEUR
        statusDiv.innerText = "Sélectionne un fichier à partager maximum 1 Gb.";
        senderSection.style.display = 'block';

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                statusDiv.innerText = "Préparation du fichier...";

                processFile(file, (processedBlob, fileName) => {
                    statusDiv.innerText = "Envoi du fichier en cours...";
                    showProgress(0);

                    const formData = new FormData();
                    formData.append('reqtype', 'fileupload');
                    formData.append('time', '1h');
                    formData.append('fileToUpload', processedBlob, fileName);

                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', 'https://corsproxy.io/?' + encodeURIComponent('https://litterbox.catbox.moe/resources/internals/api.php'), true);

                    xhr.upload.onprogress = (event) => {
                        if (event.lengthComputable) {
                            const percentComplete = (event.loaded / event.total) * 100;
                            showProgress(percentComplete);
                        }
                    };

                    xhr.onload = () => {
                        hideProgress();
                        if (xhr.status === 200) {
                            const fileUrl = xhr.responseText.trim();
                            if (fileUrl && fileUrl.startsWith('http')) {
                                currentShareableUrl = `${window.location.origin}${window.location.pathname}?url=${encodeURIComponent(fileUrl)}&name=${encodeURIComponent(fileName)}`;
                                
                                qr.value = currentShareableUrl;
                                qrcodeCanvas.style.display = 'inline-block';
                                qrHelp.style.display = 'block';
                                qrActions.style.display = 'block';
                                statusDiv.innerText = "QR Code prêt ! Scanne-le ou partage-le.";
                            } else {
                                statusDiv.innerText = "Erreur lors de l'envoi du fichier.";
                            }
                        } else {
                            statusDiv.innerText = "Erreur lors du transfert.";
                        }
                    };

                    xhr.onerror = () => {
                        hideProgress();
                        statusDiv.innerText = "Erreur de connexion.";
                    };

                    xhr.send(formData);
                });
            }
        });

        shareLinkBtn.addEventListener('click', () => {
            if (navigator.share) {
                navigator.share({
                    title: 'Partage de fichier',
                    text: 'Voici le fichier que je te partage :',
                    url: currentShareableUrl
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(currentShareableUrl);
                alert("Lien copié dans le presse-papier !");
            }
        });

        downloadQrBtn.addEventListener('click', () => {
            const qrImageUrl = qrcodeCanvas.toDataURL("image/png");
            const a = document.createElement('a');
            a.href = qrImageUrl;
            a.download = "qrcode_partage.png";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
    }
</script>

</body>
</html>
